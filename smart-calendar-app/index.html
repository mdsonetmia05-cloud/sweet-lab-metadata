<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sweet Smart Calendar &mdash; Sweet Metadata Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#F3ECDA;--panel:#FBF7EC;--ink:#2E2118;--muted:#71624E;--bronze:#6B4423;--line:#D9CBAE}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--page);color:var(--ink);font-family:Inter,system-ui,sans-serif}
body{display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.top a.back{color:var(--bronze);text-decoration:none;font-weight:600;font-size:13px;white-space:nowrap}
.top h1{font-family:"Dancing Script",cursive;font-size:26px;margin:0;color:var(--ink)}
.top .note{margin-left:auto;font-size:12px;color:var(--muted)}
.top .note a{color:var(--bronze)}
.frame-wrap{flex:1;min-height:0}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<div class="top">
<a class="back" href="../">&larr; Sweet Metadata Lab</a>
<h1>Sweet Smart Calendar</h1>
<span class="note">Runs inside Sweet Lab &middot; <a href="https://sweet-smart-calendar.vercel.app/" target="_blank" rel="noopener">Open directly &nearr;</a></span>
</div>
<div class="frame-wrap">
<iframe src="https://sweet-smart-calendar.vercel.app/" title="Sweet Smart Calendar" allow="clipboard-read; clipboard-write"></iframe>
</div>
</body>
</html>
